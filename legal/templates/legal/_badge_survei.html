{% load i18n %}{% if s.status == 'VERIFIKADU' %}<span class="badge badge-success rounded-pill px-3"><i class="fa fa-check"></i> {{ s.get_status_display }}</span>{% elif s.status == 'HARUKA' %}<span class="badge badge-warning rounded-pill px-3"><i class="fa fa-hourglass-half"></i> {{ s.get_status_display }}</span>{% elif s.status == 'REJEITADU' %}<span class="badge badge-danger rounded-pill px-3"><i class="fa fa-undo"></i> {{ s.get_status_display }}</span>{% else %}<span class="badge badge-secondary rounded-pill px-3"><i class="fa fa-pencil"></i> {{ s.get_status_display }}</span>{% endif %}
