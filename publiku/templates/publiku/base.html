{% load static i18n %}<!DOCTYPE html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE|default:'tet' }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>{% block title %}SIBAR-RbR · {% trans "Monitorizasaun kazu konflitu rai" %}{% endblock %} | Rede ba Rai</title>
	<meta name="description" content="{% trans "Dadus públiku, anónimu no verifikadu kona-ba konflitu rai no eviksaun iha Timor-Leste." %}">
	<meta name="author" content="Onosio, Ricardo, Olavio">
	<meta name="copyright" content="Rede ba Rai">
	<meta name="robots" content="index, follow">
	<meta name="referrer" content="strict-origin-when-cross-origin">
	<meta name="theme-color" content="#FAF7F2">
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Rede ba Rai">
	<meta property="og:title" content="SIBAR-RbR · {% trans "Monitorizasaun kazu konflitu rai" %}">
	<meta property="og:description" content="{% trans "Dadus públiku, anónimu no verifikadu kona-ba konflitu rai no eviksaun iha Timor-Leste." %}">
	<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'main/images/icon-512.png' %}">
	<link rel="icon" type="image/png" href="{% static 'main/images/favicon.png' %}">
	<link rel="apple-touch-icon" href="{% static 'main/images/icon-192.png' %}">
	<link rel="stylesheet" href="{% static 'main/font-awesome/css/font-awesome.min.css' %}">
	<link rel="stylesheet" href="{% static 'main/css/fonts.css' %}">
	{% block styles %}{% endblock %}
</head>
<body class="landing">
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
