{% load static i18n l10n smkre_tags %}
{# Mapa kazu — include iha report/mapa.html. Aset hotu lokál (offline). #}
<link rel="stylesheet" href="{% static 'main/leaflet/leaflet.css' %}">
<link rel="stylesheet" href="{% static 'main/leaflet/MarkerCluster.css' %}">
<link rel="stylesheet" href="{% static 'main/leaflet/MarkerCluster.Default.css' %}">

<div id="mapa" data-geojson="{% static 'main/geojson/timor_munisipiu.json' %}"
	data-l-kazu="{% trans "kazu" %}" data-l-legend="{% trans "Lejenda" %}" data-l-urjente="{% trans "Urjente" %}"
	data-l-baze="{% trans "Mapa Baze (offline)" %}" data-l-street="{% trans "Street" %}" data-l-satelite="{% trans "Satélite" %}"
	data-l-fronteira="{% trans "Fronteira Munisípiu" %}" data-l-hotspot="{% trans "Hotspot (total kada munisípiu)" %}"
	data-l-zoom="{% trans "Haree uma besik" %}" data-l-ha-u="{% trans "Ha'u-nia fatin" %}"
	data-l-besik="{% trans "kazu iha raiu 1 km husi ita" %}" data-l-gps-erru="{% trans "Labele hetan ita-nia fatin. Loke GPS no fó autorizasaun ba browser." %}"></div>

<!-- maps script -->
<script src="{% static 'main/leaflet/leaflet.js' %}"></script>
<script src="{% static 'main/leaflet/leaflet.markercluster.js' %}"></script>

<script nonce="{{ request.csp_nonce }}">
(function () {
var L_ = document.getElementById('mapa').dataset;

// [lat, lng, popup, status kazu, urjente]
var addressPoints = [
	{% for i in mapobjects %}
	[{{ i.latitude|unlocalize }}, {{ i.longitude|unlocalize }}, "{% if i.fotos %}<img src='{{ i.fotos.0.file.url }}' class='map-foto' alt=''>{% endif %}<h6 class='mb-1'>{{ i.kode|js_html }}{% if i.urjente %} <span class='badge badge-urjente'>URJENTE</span>{% endif %}</h6>{% trans "Fatin" %} : <a href='{% url 'kazu-detail' i.pk %}'>{% if i.suku %}{{ i.suku.name|js_html }}, {% endif %}{% if i.postu %}{{ i.postu.name|js_html }}, {% endif %}{{ i.munisipiu.name|js_html }}</a><br/>{% trans "Tipu" %} : {% for t in i.tipu_konflitu.all %}{{ t.name|js_html }}{% if not forloop.last %}, {% endif %}{% endfor %}<br/>{% trans "Uma-kain" %} : {{ i.total_uma_kain }}<br/>{% trans "Status Kazu" %} : {{ i.get_status_kazu_display|js_html }}<br/>{% trans "Status Dadus" %} : {{ i.get_status_display|js_html }}<br/><a class='btn btn-sm btn-rbr mt-1' href='{% url 'kazu-detail' i.pk %}'>{% trans "Haree Detalla" as t %}{{ t|js_html }}</a>", "{{ i.status_kazu }}", {{ i.urjente|yesno:"true,false" }}],
	{% endfor %}
];

// Hotspot: code munisípiu → [total, lat, lng, naran]
var munTotal = {
	{% for m, n in munobjects %}"{{ m.code|escapejs }}": [{{ n }}, {{ m.latitude|default_if_none:"null"|unlocalize }}, {{ m.longitude|default_if_none:"null"|unlocalize }}, "{{ m.name|js_html }}"],
	{% endfor %}
};

//maps layer
var mapaBaze = L.layerGroup();
// maxNativeZoom: nivel imajen ikus husi servidór; liu ida-ne'e Leaflet boot imajen (haree uma ida-idak)
var openStreetMaps = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxNativeZoom: 19, maxZoom: 20});
var sateliteMaps = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
	attribution: 'Tiles &copy; Esri', maxNativeZoom: 18, maxZoom: 20});
var ZOOM_UMA = 19;   // zoom ba haree uma sira besik kazu
//maps layer

var user_location = [-8.85, 125.8];
var map = L.map('mapa', {
	center: user_location,
	zoom: 8,
	maxZoom: 20,
	layers: [navigator.onLine ? openStreetMaps : mapaBaze]
});

//icon///////////////////
var ikonUrl = {
	blue: "{% static 'main/mapa/marker-blue.svg' %}", gold: "{% static 'main/mapa/marker-gold.svg' %}",
	violet: "{% static 'main/mapa/marker-violet.svg' %}", green: "{% static 'main/mapa/marker-green.svg' %}",
	grey: "{% static 'main/mapa/marker-grey.svg' %}", red: "{% static 'main/mapa/marker-red.svg' %}"
};
function iconKor(kor) {
	return new L.Icon({
		iconUrl: ikonUrl[kor],
		shadowUrl: "{% static 'main/mapa/marker-shadow.png' %}",
		iconSize: [25, 41],
		iconAnchor: [12, 41],
		popupAnchor: [1, -34],
		shadowSize: [41, 41]
	});
}
var redIcon = iconKor('red');           // urjente
var statusKazu = {
	// status kazu: [label, kor ikon]
	{% for code, label, kor in status_kazu_list %}"{{ code }}": ["{{ label|js_html }}", "{{ kor }}"],
	{% endfor %}
};
//icon///////////////////

// ── Zoom besik: satélite + uma sira iha kazu nia sorin ──
function butaunZoom(lat, lng) {
	return "<button type='button' class='btn btn-sm btn-outline-rbr btn-block mt-1 js-zoom-uma' data-lat='" + lat + "' data-lng='" + lng + "'>"
		+ "<i class='fa fa-search-plus'></i> " + L_.lZoom + "</button>";
}
function hiliSatelite() {
	if (!navigator.onLine || map.hasLayer(sateliteMaps)) return;
	[mapaBaze, openStreetMaps].forEach(function (l) { map.removeLayer(l); });
	map.addLayer(sateliteMaps);
}
function zoomUma(lat, lng) {
	hiliSatelite();
	map.flyTo([lat, lng], ZOOM_UMA, {duration: 1.2});
}
map.on('popupopen', function (e) {
	var btn = e.popup.getElement().querySelector('.js-zoom-uma');
	if (btn) btn.addEventListener('click', function () { zoomUma(+btn.dataset.lat, +btn.dataset.lng); });
});

// Marker kada status kazu (grupu cluster ida kada status)
var markers = {};
Object.keys(statusKazu).forEach(function (code) {
	markers[code] = L.markerClusterGroup({disableClusteringAtZoom: 17});   // zoom besik: marker ida-idak
	markers[code].icon = iconKor(statusKazu[code][1]);
});
for (var i = 0; i < addressPoints.length; i++) {
	var a = addressPoints[i];
	var title = a[2];
	var grupu = markers[a[3]];
	if (!grupu) continue;
	var marker = L.marker(new L.LatLng(a[0], a[1]), {
		icon: a[4] ? redIcon : grupu.icon
	});
	marker.bindPopup(title + butaunZoom(a[0], a[1]), {maxWidth: 260});
	grupu.addLayer(marker);
}
Object.keys(markers).forEach(function (code) { map.addLayer(markers[code]); });

// Fronteira munisípiu (GeoJSON lokál) + hotspot
function colorFor(n) { return n >= 15 ? '#dc3545' : n >= 5 ? '#fd7e14' : n >= 1 ? '#0E8A68' : '#dff0c8'; }
var fronteira = L.geoJSON(null, {
	style: function (f) {
		var n = (munTotal[f.properties.code] || [0])[0];
		return {color: '#6f8f4f', weight: 1.5, fillColor: colorFor(n), fillOpacity: 0.35};
	},
	onEachFeature: function (f, layer) {
		var m = munTotal[f.properties.code] || [0, 0, 0, f.properties.name];
		layer.bindTooltip(m[3] + ': ' + m[0] + ' ' + L_.lKazu);
	}
}).addTo(map);
// Fokus husi detalla kazu: /report/mapa/#-8.55,125.57 → zoom direta ba fatin kazu
var fokus = /^#(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/.exec(window.location.hash);
fetch(L_.geojson).then(function (r) { return r.json(); }).then(function (geo) {
	fronteira.addData(geo);
	if (fokus) zoomUma(+fokus[1], +fokus[2]);
	else map.fitBounds(fronteira.getBounds(), {padding: [10, 10]});
});

var hotspot = L.layerGroup();
Object.keys(munTotal).forEach(function (code) {
	var m = munTotal[code];
	if (!m[0] || m[1] === null) return;
	L.circleMarker([m[1], m[2]], {radius: 8 + Math.sqrt(m[0]) * 4, color: '#fff', weight: 2, fillColor: colorFor(m[0]), fillOpacity: 0.9})
		.bindTooltip('<b>' + m[3] + '</b>: ' + m[0] + ' ' + L_.lKazu, {direction: 'top'}).addTo(hotspot);
	L.marker([m[1], m[2]], {icon: L.divIcon({className: 'hot-label', html: String(m[0]), iconSize: [30, 16]}), interactive: false}).addTo(hotspot);
});

var baseMaps = {};
baseMaps["<span style='color: grey'>" + L_.lBaze + "</span>"] = mapaBaze;
baseMaps["<span style='color: blue'>" + L_.lStreet + "</span>"] = openStreetMaps;
baseMaps["<span style='color: green'>" + L_.lSatelite + "</span>"] = sateliteMaps;

var overlayMaps = {};
overlayMaps[L_.lFronteira] = fronteira;
overlayMaps[L_.lHotspot] = hotspot;
Object.keys(statusKazu).forEach(function (code) {
	var s = statusKazu[code];
	overlayMaps["<img src='" + ikonUrl[s[1]] + "' class='layer-ikon' alt=''> " + s[0]] = markers[code];
});

var layerControl = L.control.layers(baseMaps, overlayMaps, {collapsed: window.innerWidth < 768}).addTo(map);

// Lejenda
var legend = L.control({position: 'bottomleft'});
legend.onAdd = function () {
	var d = L.DomUtil.create('div', 'map-legend');
	var html = '<b>' + L_.lLegend + '</b><br>';
	Object.keys(statusKazu).forEach(function (code) {
		html += "<img src='" + ikonUrl[statusKazu[code][1]] + "' class='layer-ikon' alt=''> " + statusKazu[code][0] + '<br>';
	});
	html += "<img src='" + ikonUrl.red + "' class='layer-ikon' alt=''> " + L_.lUrjente;
	d.innerHTML = html;
	return d;
};
legend.addTo(map);

// ── Butaun "Ha'u-nia fatin": GPS utilizador + kazu sira iha raiu 1 km ──
var ha_u = L.layerGroup().addTo(map);
var locate = L.control({position: 'topleft'});
locate.onAdd = function () {
	var b = L.DomUtil.create('a', 'leaflet-bar map-locate');
	b.href = '#';
	b.title = L_.lHaU;
	b.setAttribute('role', 'button');
	b.setAttribute('aria-label', L_.lHaU);
	b.innerHTML = "<i class='fa fa-crosshairs'></i>";
	L.DomEvent.on(b, 'click', function (e) {
		L.DomEvent.preventDefault(e);
		L.DomEvent.stopPropagation(e);
		map.locate({enableHighAccuracy: true, timeout: 15000});
	});
	return b;
};
locate.addTo(map);
map.on('locationfound', function (e) {
	var besik = addressPoints.filter(function (a) { return e.latlng.distanceTo([a[0], a[1]]) <= 1000; }).length;
	ha_u.clearLayers();
	L.circle(e.latlng, {radius: 1000, color: '#0E8A68', weight: 1, fillOpacity: 0.05, interactive: false}).addTo(ha_u);
	L.circle(e.latlng, {radius: e.accuracy, color: '#1e88e5', weight: 1, fillOpacity: 0.15, interactive: false}).addTo(ha_u);
	L.circleMarker(e.latlng, {radius: 8, color: '#fff', weight: 3, fillColor: '#1e88e5', fillOpacity: 1}).addTo(ha_u)
		.bindPopup('<b>' + L_.lHaU + '</b><br>' + besik + ' ' + L_.lBesik).openPopup();
	hiliSatelite();
	map.flyTo(e.latlng, 17, {duration: 1.2});
});
map.on('locationerror', function () { window.alert(L_.lGpsErru); });

// Offline → hili mapa baze automátiku
window.addEventListener('offline', function () {
	map.removeLayer(openStreetMaps); map.removeLayer(sateliteMaps); map.addLayer(mapaBaze);
});
})();
</script>
