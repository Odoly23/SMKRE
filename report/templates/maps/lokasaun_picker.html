{% load static i18n l10n smkre_tags %}
{# Mapa hadia lokasaun kazu: dada marka ka klik mapa → latitude/longitude iha formuláriu. Aset lokál. #}
<link rel="stylesheet" href="{% static 'main/leaflet/leaflet.css' %}">

<div id="mapa-pick" class="mapa-pick"
	data-lat="{{ objects.latitude|unlocalize }}" data-lng="{{ objects.longitude|unlocalize }}"
	data-aproksimadu="{{ objects.gps_aproksimadu|yesno:'1,' }}" data-mun="{{ objects.munisipiu.code }}"
	data-geojson="{% static 'main/geojson/timor_munisipiu.json' %}" data-mapbox="{{ MAPBOX_TOKEN }}"
	data-ikon="{% static 'main/mapa/marker-red.svg' %}" data-ikon-uluk="{% static 'main/mapa/marker-grey.svg' %}" data-sombra="{% static 'main/mapa/marker-shadow.png' %}"
	data-l-fullscreen="{% trans "Ekran tomak" %}" data-l-ha-u="{% trans "Ha'u-nia fatin" %}" data-l-sukat="{% trans "Sukat distánsia" %}"
	data-l-gps-erru="{% trans "Labele hetan ita-nia fatin. Loke GPS no fó autorizasaun ba browser." %}"
	data-l-reset="{% trans "Fila ba fatin uluk" %}" data-l-uluk="{% trans "Fatin uluk" %}" data-l-foun="{% trans "Fatin foun — dada ka klik mapa" %}"
	data-l-uza-gps="{% trans "Uza ha'u-nia GPS ba kazu ne'e?" %}"></div>
<p class="small text-muted mt-2 mb-0">
	<i class="fa fa-hand-pointer-o"></i> {% trans "Dada marka mean ka klik iha mapa. Uza Satélite atu haree uma no dalan." %}
</p>

<script src="{% static 'main/leaflet/leaflet.js' %}"></script>
<script src="{% static 'main/mapa/smkre_mapa.js' %}"></script>
<script nonce="{{ request.csp_nonce }}">
(function () {
var el = document.getElementById('mapa-pick'), D = el.dataset;
var inpLat = document.getElementById('id_latitude'), inpLng = document.getElementById('id_longitude');
var uluk = L.latLng(parseFloat(D.lat), parseFloat(D.lng));

//maps layer
var baze = SMKREMapa.baze(D.mapbox);
var map = L.map('mapa-pick', { center: uluk, zoom: D.aproksimadu ? 12 : 17, maxZoom: 20,
	layers: [navigator.onLine ? baze['Satélite'] : L.layerGroup()] });
L.control.layers(baze, {}, { collapsed: true }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

//icon
function ikon(url) { return L.icon({ iconUrl: url, shadowUrl: D.sombra, iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] }); }

// Fatin uluk (cinzentu) + marka foun (mean, bele dada)
L.marker(uluk, { icon: ikon(D.ikonUluk), interactive: false, keyboard: false, opacity: 0.7 }).addTo(map).bindTooltip(D.lUluk);
var marka = L.marker(uluk, { icon: ikon(D.ikon), draggable: true, autoPan: true }).addTo(map).bindTooltip(D.lFoun, { direction: 'top', offset: [0, -36] });

function hatama(ll) {
	inpLat.value = ll.lat.toFixed(6);
	inpLng.value = ll.lng.toFixed(6);
}
function muda(ll, voa) {
	marka.setLatLng(ll);
	hatama(ll);
	if (voa) map.panTo(ll);
}
marka.on('dragend', function () { hatama(marka.getLatLng()); });
var sukatAtivu = false;
map.on('smkre:sukat', function (e) { sukatAtivu = e.ativu; });
map.on('click', function (e) { if (!sukatAtivu) muda(e.latlng); });
[inpLat, inpLng].forEach(function (inp) {
	inp.addEventListener('change', function () {
		var lat = parseFloat(inpLat.value), lng = parseFloat(inpLng.value);
		if (!isNaN(lat) && !isNaN(lng)) muda(L.latLng(lat, lng), true);
	});
});

// Kontrolu: ekran tomak, GPS (husu molok muda marka), sukat, reset, koordenada
SMKREMapa.fullscreen(map);
SMKREMapa.lokasaun(map, function (ll) { if (window.confirm(D.lUzaGps)) muda(ll); });
SMKREMapa.sukat(map);
var reset = L.control({ position: 'topleft' });
reset.onAdd = function () {
	var a = L.DomUtil.create('a', 'leaflet-bar smkre-map-btn');
	a.href = '#'; a.title = D.lReset; a.setAttribute('role', 'button'); a.setAttribute('aria-label', D.lReset);
	a.innerHTML = '<i class="fa fa-undo"></i>';
	L.DomEvent.on(a, 'click', function (e) { L.DomEvent.preventDefault(e); L.DomEvent.stopPropagation(e); muda(uluk, true); });
	return a;
};
reset.addTo(map);
SMKREMapa.koordenada(map);

// Fronteira munisípiu kazu nian (orientasaun)
fetch(D.geojson).then(function (r) { return r.json(); }).then(function (geo) {
	L.geoJSON(geo, {
		filter: function (f) { return f.properties.code === D.mun; },
		style: { color: '#0E8A68', weight: 2, fill: false, dashArray: '6 4' },
		interactive: false
	}).addTo(map);
});
})();
</script>
