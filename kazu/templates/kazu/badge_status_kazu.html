{% load i18n %}{% with d=obj.desizaun %}{% if d == 'ADVOKASIA' %}
	<span class="badge badge-danger rounded-pill px-3" title="{% trans "Desizaun RbR" %}"><i class="fa fa-gavel"></i> {% trans "Advokasia ativu" %}</span>
{% elif d == 'MONITORIZASAUN' %}
	<span class="badge badge-info rounded-pill px-3" title="{% trans "Desizaun RbR" %}"><i class="fa fa-eye"></i> {% trans "Monitorizasaun" %}</span>
{% elif d == 'ARKIVU' %}
	<span class="badge badge-secondary rounded-pill px-3" title="{% trans "Desizaun RbR" %}"><i class="fa fa-archive"></i> {% trans "Arkivu" %}</span>
{% endif %}{% endwith %}
{% if obj.urjente %}
	<span class="badge badge-urjente rounded-pill px-3"><i class="fa fa-exclamation-triangle"></i> {% trans "URJENTE" %}</span>
{% endif %}
