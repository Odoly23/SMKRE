{% extends "auth/email/base.html" %}
{% block body %}
<p>Bondia,</p>
<p>Ita husu atu troka password SMKRE ba <b>{{ email }}</b>. Klik butaun iha okos (validu oras 1):</p>
<p><a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display:inline-block;background:#0E8A68;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none">Troka Password</a></p>
<p>Se ita la husu, favor ignora email ne'e.</p>
{% endblock %}
