{% extends "auth/_box.html" %}
{% load i18n crispy_forms_tags %}
{% block box_title %}{% trans "Haluha password?" %}{% endblock %}
{% block box %}
<p class="text-muted">{% trans "Hatama ita-nia email. Ami sei haruka link atu troka password (validu oras 1)." %}</p>
<form method="post" novalidate>{% csrf_token %}
	{{ form|crispy }}
	<button type="submit" class="btn btn-rbr btn-block"><i class="fa fa-envelope"></i> {% trans "Haruka Link" %}</button>
</form>
{% endblock %}
